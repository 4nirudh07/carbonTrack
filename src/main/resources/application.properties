spring.application.name=carbontrack
server.port=8081
# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/carbontrack_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=8713

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
